  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <title>Sijia Ma - Personal Portfolio</title>
  <!-- Analytics Tracking - Full SPA Support -->
  <script>
    (function () {
      var server = 'https://mathew-tracker.yunguhs.com';
      var lastPath = '';

      var uid = localStorage.getItem('_uid') || (function () {
        var id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0; return (c == 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
        try { localStorage.setItem('_uid', id); } catch (e) { }
        return id;
      })();

      function getFullPath() {
        // Include hash for SPA routes like /#/about
        return location.pathname + location.hash;
      }

      function track(ref) {
        var currentPath = getFullPath();
        // Avoid duplicate tracking
        if (currentPath === lastPath) return;
        lastPath = currentPath;

        var url = server + '/collect?uid=' + uid +
          '&url=' + encodeURIComponent(currentPath) +
          '&referrer=' + encodeURIComponent(ref || document.referrer);

        fetch(url, { mode: 'no-cors', credentials: 'omit' }).then(function () {
          console.log('📊 Tracked:', currentPath);
        }).catch(function (e) {
          console.log('📊 Track failed:', e.message);
        });
      }

      // Initial page load
      if (document.readyState === 'complete') {
        track();
      } else {
        window.addEventListener('load', function () { track(); });
      }

      // SPA Navigation: Hash changes (Vue Router hash mode)
      window.addEventListener('hashchange', function () {
        track(lastPath);
      });

      // SPA Navigation: History API (pushState/replaceState)
      var origPush = history.pushState;
      var origReplace = history.replaceState;
      history.pushState = function () {
        origPush.apply(this, arguments);
        setTimeout(function () { track(lastPath); }, 0);
      };
      history.replaceState = function () {
        origReplace.apply(this, arguments);
        setTimeout(function () { track(lastPath); }, 0);
      };
      window.addEventListener('popstate', function () {
        track(lastPath);
      });

      console.log('📊 Analytics ready, uid:', uid);
    })();
  </script>

</head>

</body>
