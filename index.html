  <!-- Inline Analytics Tracking -->
  <script>
    (function () {
      var server = 'https://mathew-tracker.com';
      var uid = localStorage.getItem('_uid') || (function () {
        var id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0; return (c == 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
        try { localStorage.setItem('_uid', id); } catch (e) { }
        return id;
      })();
      function track() {
        var url = server + '/collect?uid=' + uid + '&url=' + encodeURIComponent(location.pathname) + '&referrer=' + encodeURIComponent(document.referrer);
        // Try fetch with no-cors (may work around mixed content)
        fetch(url, { mode: 'no-cors', credentials: 'omit' }).then(function () {
          console.log('📊 Analytics: sent via fetch');
        }).catch(function (e) {
          console.log('📊 Analytics: request blocked', e.message);
        });
      }
      if (document.readyState === 'complete') { track(); } else { window.addEventListener('load', track); }
      console.log('📊 Analytics initialized, uid:', uid);
    })();
  </script>
